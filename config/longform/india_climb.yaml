  narration: 'Here is what the ranking hides. India''s economy is enormous because India is
    enormous. Divide it by the people who live there and the picture changes completely. Income
    per person is about 2,700 dollars a year. That is one hundred and forty-fourth out of
    186 countries. China is at almost 14,000. Britain is above 57,000. Bangladesh, next door,
    is level with India. A top-five economy and a top-five standard of living are very different
    things.

    '
- short:
    title: 'By This Measure, India Is Already #3 in the World'
    narration: By one measure, India is already the third largest economy in the world. A
      dollar buys far more in India than it does in America, so economists also compare countries
      by what their money can actually buy. On that measure India has been third since 2009,
      behind only China and the United States. It passed Germany on this measure back in 2003.
  id: buying_power
  heading: Measured another way
  chart:
    mode: bar_race
    code: NY.GDP.MKTP.PP.CD
    year_min: 1990
    year_max: 2025
    top_n: 10
  narration: 'There is one more way to count. A dollar buys far more in India than it does
    in America, so economists also compare countries by what their money can actually buy.
    On that measure India is not fifth or sixth. It has been the third largest economy in
    the world since 2009, behind only China and the United States, and it passed Germany on
    this measure back in 2003.

    '
