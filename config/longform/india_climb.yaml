- short:
    title: India's First Trillion Took 60 Years. The Second Took 7.
    narration: It took India sixty years after independence to build a one trillion dollar
      economy. The second trillion took seven. It was not a miracle. It was a slow, steady
      build. Through the nineties the economy grew at just under six percent a year. From
      2003 to 2012 that rose to seven. By 2000 India was back to thirteenth in the world,
      at 468 billion dollars. In 2007 it crossed one trillion. By 2014 it had passed two.
  id: slow_build
  heading: The slow build
  chart:
    mode: line_grow
    code: NY.GDP.MKTP.CD
    entity: India
    year_min: 1991
    year_max: 2010
  narration: 'What follows is not a miracle. It is a slow, steady build. Through the nineties
    the economy grows at just under six percent a year. From 2003 to 2012 that rises to seven.
    By 2000 India is back to thirteenth, at 468 billion dollars. In 2007 it crosses one trillion.
    It took sixty years after independence to reach the first trillion. The second
    took seven.

    '
- short:
    title: Watch India Overtake Canada, Italy, Brazil, Russia and France
    narration: 'Canada. Italy. Brazil. Russia. France. Between 2013 and 2019, India passed
      every one of them. Canada for good in 2013. Italy in 2015, along with Brazil and Russia.
      France in 2019. That made India the sixth largest economy on Earth. Next in line: Britain.'
  id: passing_the_old_powers
  heading: Passing the old powers
  chart:
    mode: bump_race
    code: NY.GDP.MKTP.CD
    highlight: India
    year_min: 2005
    year_max: 2025
    top_n: 12
  narration: 'From here the names India passes get more famous. Canada, for good, in 2013.
    Italy in 2015, along with Brazil and Russia. France in 2019. By then India is the sixth
    largest economy on Earth, and there is one country directly ahead of it with a particular
    history.

    '
- short:
    title: 'India vs Britain: Who Has the Bigger Economy?'
  id: india_vs_uk
  heading: India and Britain
  chart:
    mode: line_multi
    code: NY.GDP.MKTP.CD
    entities:
    - India
    - United Kingdom
    year_min: 1976
    year_max: 2025
  narration: 'In 1976 Britain''s economy was more than twice India''s. In 2022, India passes
    it, and becomes the world''s fifth largest economy. It holds that place for three years.
    Then look at the latest figures. In 2025 Britain is back in front, four trillion dollars
    to 3.96. That is not India shrinking. These rankings are measured in US dollars, so a
    move in the exchange rate can swap two countries that are this close. The honest description
    is that they are level.

    '
- short:
    title: China and India Were Equal in 1980. What Happened?
    narration: 'In 1980, China''s economy was almost exactly the size of India''s. In 1990
      it was still only thirteen percent bigger. Then China pulled away: two and a half times
      India''s size by 2000, nearly four times by 2010, more than five and a half times by
      2020. Since then India has grown faster, and the gap has narrowed a little, to just
      under five times. India climbed past Europe. It did not keep up with China.'
  id: the_gap_to_china
  heading: The gap that did not close
  chart:
    mode: line_multi
    code: NY.GDP.MKTP.CD
    entities:
    - India
    - China
    year_min: 1976
    year_max: 2025
  narration: 'Now the comparison that matters most. In 1980 China''s economy was almost exactly
    the size of India''s. In 1990 it was still only thirteen percent bigger. Then China pulls
    away: two and a half times India''s size by 2000, nearly four times by 2010, more than
    five and a half times by 2020. Since then India has grown faster, and the gap has narrowed
    a little, to just under five times. India climbed past Europe. It did not keep up with
    China.

    '
- short:
    title: Can India Catch Japan and Germany?
    narration: Can India catch Japan and Germany? Japan's economy is 4.4 trillion dollars.
      Germany, in third place, is at just over five. India is at 3.96. The difference is in
      the direction. Over the last five years India has grown at close to eight percent a
      year. Germany has averaged under one. Japan a little over one. Nobody can promise the
      future, but the distance to third place is the smallest it has ever been.
  id: next_in_line
  heading: Who is next
  chart:
    mode: line_multi
    code: NY.GDP.MKTP.CD
    entities:
    - India
    - Japan
    - Germany
    year_min: 2000
    year_max: 2025
  narration: 'Ahead of India now are Japan, at 4.4 trillion dollars, and Germany, at just
    over five. India is at 3.96. The difference is in the direction. Over the last five years
    India has grown at close to eight percent a year. Germany has averaged under one. Japan
    a little over one. Nobody can promise the future, but the distance to third place is the
    smallest it has ever been.

    '
- short:
    title: India Is a Top Economy. So Why Is It 144th?
    narration: India has one of the biggest economies in the world. So why does it rank one
      hundred and forty-fourth? India's economy is enormous because India is enormous. Divide
      it by the people who live there and the picture changes completely. Income per person
      is about 2,700 dollars a year. That is one hundred and forty-fourth out of 186 countries.
      China is at almost 14,000. Britain is above 57,000. Bangladesh, next door, is level
      with India. A top economy and a top standard of living are very different things.
  id: the_catch
  heading: The catch
  chart:
    mode: bar_race
