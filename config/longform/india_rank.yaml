# Long-form episode: Where Does India Rank?  DRAFT SCRIPT, written 2026-10-29.
#
# A countdown through ten world rankings, from India's worst place to its best.
# Every number in the narration comes from the World Bank API as fetched on
# 2026-10-29 (NY.GDP.PCAP.CD, SP.DYN.LE00.IN, IP.PAT.RESD, IS.AIR.PSGR,
# NY.GDP.MKTP.PP.CD, NY.GDP.MKTP.CD, IP.JRN.ARTC.SC, IT.CEL.SETS,
# BX.GSR.CCIS.CD, BX.TRF.PWKR.CD.DT, SP.POP.TOTL). Ranks are among every
# country with a figure in that year (aggregates such as "Fragility, Conflict
# and Violence situations" excluded). 2025 figures are first estimates.
#
# Each chart's final year is the latest year the Bank has for that measure:
# air passengers and science papers stop in 2023, mobile phones and patents in
# 2024. Lines marked `check:` state something that is NOT in that data.
#
# Dropped while drafting: military spending (Russia has no 2025 figure, so the
# chart would show India 4th when it is 5th) and cereal output (India has been
# 3rd every year since 1961, so there is no climb to show).

