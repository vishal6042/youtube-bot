      question:
        at: which
        text: Which ranking surprised you most? Tell us in the comments.
      subscribe:
        at: subscribe
      share:
        at: share
  narration: So, first in people and in money sent home. Second in phones and IT. Third in
    science and buying power. Top five in flying and inventing. And still a hundred and thirty-seventh
    for how long people live and a hundred and forty-fourth for income per person. India is
    a giant that is still getting rich, one person at a time. Which ranking surprised you
    most? Tell us in the comments. And if you enjoyed this, subscribe for more of the world
    in numbers, and share it with a friend who thinks they know where India ranks.
  short:
    skip: true
shorts_outro: All ten of India's world rankings are in the full video on the channel.
