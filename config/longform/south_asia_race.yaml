  narration: Then India came back. From 2021 to 2025, its economy grew by almost eight per
    cent a year, faster than Bangladesh's in every one of those five years. Bangladesh averaged
    five and a half per cent, and Pakistan three and a half. In 2019, India had grown by three
    point nine per cent. It doubled its pace. If you're enjoying the race so far, do subscribe.
    It really helps the channel.
  short:
    title: India Has Outgrown Bangladesh Every Year Since 2021
