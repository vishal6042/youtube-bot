    headline: The long race
    deck: '**For forty years, Pakistan led.** Then the lead changed hands three times in sixteen years.'
    who_led: true
    marks:
    - {year: 1971, label: 1971 · Bangladesh born}
    - {year: 1991, label: 1991 · India opens up}
