    - {year: 2022, entity: India, label: India takes it back, title: '2022', at: '2022'}
  narration: But look at the youngest. In 1990, out of every thousand children born in India, a hundred
    and twenty-seven died before their fifth birthday. Bangladesh did better than India from 1998. Then
    India's numbers fell faster, and in 2022 it took the lead back. Today the figure is twenty-seven in
    India, just over thirty in Bangladesh, and fifty-six in Pakistan.
  short:
    title: India Just Took Back the Lead on Child Survival
