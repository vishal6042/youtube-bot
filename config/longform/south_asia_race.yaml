  narration: On health, India has come a long way. In 1980, a baby born in India could expect
    to live fifty-three and a half years. Today, it is seventy-two, almost nineteen years
    more. Bangladesh has done better still, rising from fifty-two to seventy-five, while Pakistan,
    which led in 1980, is now last, at sixty-eight.
  short:
    title: Indians Now Live 19 Years Longer Than in 1980
