  narration: So, who is winning? Count the four measures in this film. India leads on income per person,
    and on keeping young children alive. Bangladesh leads on how long people live, and on women at
    work. Pakistan, richer than India for most of forty years, leads on none. It is a dead heat. India's
    economy, though, is almost nine times the size of Bangladesh's.
