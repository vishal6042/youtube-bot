  narration: Why did India fall behind? Two reasons. First, India slowed down. In 2019, its
    economy grew by three point nine per cent, while Bangladesh's grew by seven point nine.
    Then the pandemic hit India much harder. In 2020, India's economy shrank by five point
    eight per cent. Bangladesh's still grew, by three point four. A slower year, then a harder
    fall.
  short:
    title: Why India Fell Behind Bangladesh in 2019
