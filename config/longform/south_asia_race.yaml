    - {year: 2000, entity: Pakistan, label: Still 45% ahead, title: '2000', at: '2000'}
    - {year: 2009, entity: India, label: India pulls ahead, title: '2009', at: '2009'}
  narration: For the first forty years, the race was Pakistan's. By 1970, the average Pakistani was
    almost half as rich again as the average Indian. Bangladesh won its independence in 1971, after a
    devastating war. India briefly caught up in the late eighties, but Pakistan surged again, and in
    2000 it was still forty-five per cent ahead. Only in 2009, almost two decades after India opened up
    its economy in 1991, did India pull ahead for good.
  check: Bangladesh's 1971 war of independence and India's 1991 economic reforms are history, not in the data.
  short:
    title: Pakistan Was Richer Than India for Most of 40 Years
