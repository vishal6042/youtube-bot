# Long-form episode: The South Asia Race.  Script v3, written 2026-11-09, for the
# documentary look (Visual Direction v2.0, chapter mode `doc`, see longform/doc.py).
# v3 tells the story from India's side and opens with a title sequence.
#
# India, Pakistan and Bangladesh started 1960 level on income per person and
# have swapped the lead ever since. Every number in the narration comes from
# the World Bank API as fetched on 2026-11-09 (NY.GDP.PCAP.CD, NY.GDP.PCAP.PP.CD,
# NY.GDP.MKTP.CD, NY.GDP.MKTP.KD.ZG, SP.POP.TOTL, SL.TLF.CACT.FE.ZS,
# SP.DYN.LE00.IN, SH.DYN.MORT). 2025 figures are first estimates.
#   Population 2025: India 1,464m, Pakistan 255m, Bangladesh 176m (1.895bn together).
#   Income per person: India ahead of Pakistan for good from 2009; Bangladesh
#   passed Pakistan 2016, India 2019 (ahead 2019-2024); India back in front 2025
#   ($2,702 v $2,597). Buying power (PPP): India ahead of Bangladesh every year
#   since 1990. Real growth 2019: India 3.9%, Bangladesh 7.9%; 2020: India -5.8%,
#   Bangladesh 3.4%. 2021-2025 average: India 7.84%, Bangladesh 5.51%, Pakistan
#   3.53%; India faster than Bangladesh in all five years.
#   GDP: India $37bn (1960) -> $3,956bn (2025); Pakistan $3.75bn -> $407bn;
#   Bangladesh $4.27bn -> $456bn. India = 9.7x Pakistan, 8.7x Bangladesh, 4.6x both.
#   Life expectancy: India 53.6 (1980) -> 72.2; Bangladesh 52.3 -> 74.9; Pakistan
#   57.2 -> 67.8. Under-5 deaths: Bangladesh lower than India 1998-2021, India
#   lower again from 2022.
# Lines marked `check:` state something that is NOT in that data.

