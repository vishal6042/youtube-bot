  narration: In sheer size, though, there is no contest. In 1960, India's economy was worth
    thirty-seven billion dollars. Today it is worth almost four trillion. That is nearly ten
    times Pakistan's, almost nine times Bangladesh's, and more than four times both of them
    put together.
  short:
    title: India's Economy Is Four Times Its Neighbours Combined
