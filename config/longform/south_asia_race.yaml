# Long-form episode: The South Asia Race.  Script v2, written 2026-11-09, for the
# documentary look (Visual Direction v2.0, chapter mode `doc`, see longform/doc.py).
#
# India, Pakistan and Bangladesh started 1960 level on income per person and
# have swapped the lead ever since. Every number in the narration comes from
# the World Bank API as fetched on 2026-11-09 (NY.GDP.PCAP.CD, NY.GDP.PCAP.PP.CD,
# NY.GDP.MKTP.CD, NY.GDP.MKTP.KD.ZG, NE.EXP.GNFS.CD, SP.POP.TOTL, SP.DYN.TFRT.IN,
# SL.TLF.CACT.FE.ZS, SP.DYN.LE00.IN, SH.DYN.MORT). 2025 figures are first
# estimates. Overtake years were computed from the yearly series:
#   income per person: India ahead of Pakistan for good from 2009; Bangladesh
#   passed Pakistan 2016, India 2019 (ahead 2019-2024); India back in front 2025
#   ($2,702 v $2,597). Buying power (PPP): India ahead of Bangladesh every year
#   since 1990. Real growth 2019: Bangladesh 7.9%, India 3.9%; 2020: Bangladesh
#   3.4%, India -5.8%. Exports: Bangladesh passed Pakistan 2014. Population:
#   Pakistan passed Bangladesh 1987. Life expectancy: Bangladesh passed Pakistan
#   2000, India 2003. Under-5 deaths: Bangladesh lower than India 1998-2021, India
#   lower again from 2022. India's GDP is 8.7 times Bangladesh's (2025).
# Lines marked `check:` state something that is NOT in that data.

