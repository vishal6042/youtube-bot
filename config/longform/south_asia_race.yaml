  narration: Nearly two billion people. Three countries whose histories are intertwined, but
    whose fortunes have taken very different paths. In 1947, British India was partitioned
    into India and Pakistan. What is now Bangladesh became East Pakistan, before winning independence
    in 1971. At the heart of this story is India, home to almost one and a half billion people.
    To its west, Pakistan. To its east, Bangladesh. And for decades, the economic lead has
    shifted. This is the South Asia race.
  check: The 1947 partition of British India and Bangladesh's 1971 independence are history,
    not in the data.
