  narration: In the early years, Pakistan pulled ahead. By 1970, its income per person was
    around 46 per cent higher than India's. Then came 1971. East Pakistan broke away after
    a devastating war, and became Bangladesh. For decades, Pakistan kept its lead. Even in
    2000, it was still around 45 per cent ahead. But India's reforms of 1991 had set it on
    a new path, and its economy accelerated. In 2009, India overtook Pakistan, and it has
    stayed ahead ever since.
  check: The 1971 war and India's 1991 reforms are history, not in the data. Pakistan 46%
    ahead in 1970 and 45% in 2000; India ahead from 2009 (current US$).
  short:
    title: India Spent 40 Years Chasing Pakistan
