  narration: Then India was overtaken from the other side. Bangladesh grew year after year.
    It passed Pakistan in 2016, and in 2019 it passed India too. For six years, the average
    Bangladeshi produced more than the average Indian. Then, in 2025, India moved back in
    front, at two thousand seven hundred and two dollars against two thousand five hundred
    and ninety-seven. And count what money actually buys at home, and India was ahead the
    whole time.
  short:
    title: India Was Overtaken in 2019. Then It Fought Back.
