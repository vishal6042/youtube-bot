  narration: Why did Bangladesh pull ahead in 2019? Two reasons. First, it was simply running faster.
    In 2019, Bangladesh's economy grew by seven point nine per cent. India's grew by three point nine.
    Then came the pandemic, and it hit India much harder. In 2020, India's economy shrank by five point
    eight per cent. Bangladesh's still grew, by three point four. Two years did it, a faster sprint and
    then a softer fall.
  short:
    title: Why Bangladesh Overtook India in 2019
- id: garment_engine
  heading: The garment engine
  chart:
    mode: doc
    kind: district
    code: NE.EXP.GNFS.CD
    entities: [Bangladesh, Pakistan]
    unit: 1000000000
    kicker: The engine · exports
    headline: The garment engine
    deck: '**Every building is $1 billion of exports.** Clothing made Bangladesh''s pile overtake Pakistan''s in 2014.'
    note: Exports of goods and services, current US$, rounded to the nearest billion · World Bank
    keys:
    - {year: 1990, at: '1990'}
    - {year: 2014, at: '2014'}
    - {year: 2025, at: '2025'}
  narration: What powered the sprint? Clothes. Bangladesh became the world's second-biggest exporter of
    garments, after China, and its factories employ millions of women. Every building here is a billion
    dollars of exports. In 1990, Pakistan sold the world three times as much as Bangladesh did.
    Bangladesh passed it in 2014, and by 2025 it was exporting fifty-one billion dollars a year, against
    Pakistan's forty-one. But the engine is under strain. In recent weeks, wage strikes have shut
    hundreds of factories, and on the twenty-fourth of November, Bangladesh leaves the United Nations'
    list of least developed countries, which will eventually end some of its duty-free access to Europe.
  check: Second-biggest garment exporter after China (WTO). Strikes shut 529 to 690 factories
    from 31 October 2026 (Business Standard, bne IntelliNews). LDC graduation on 24 November
    2026; the EU keeps duty-free access for a three-year transition.
  short:
    title: How Clothes Made Bangladesh Richer Than Pakistan
- id: population_twist
  heading: The population twist
  chart:
    mode: doc
    kind: terrain
    view: flanks
    kicker: The population twist
    headline: "In 1971, Bangladesh had more people.\nToday, Pakistan has **80 million more.**"
    headline_w: 820
    headline_at: twist
    note: Gold ring = population in 1971 · World Bank
    columns:
    - {country: Bangladesh, lonlat: [90.3, 23.9], from: 70.3, to: 175.7, from_at: seventy, at: today,
       label: Bangladesh · 2025, suffix: m, from_label: 1971 · 70m, from_title: Bangladesh · 1971, side: -1}
    - {country: Pakistan, lonlat: [70.6, 29.2], from: 61.8, to: 255.2, from_at: sixty, at: today,
       label: Pakistan · 2025, suffix: m, from_label: 1971 · 62m, from_title: Pakistan · 1971, side: 1}
  narration: Here is a twist few people know. When Bangladesh became independent in 1971, it had more
    people than Pakistan, seventy million against sixty-two. Pakistan overtook it in 1987, and today it
    has two hundred and fifty-five million people, to Bangladesh's hundred and seventy-six. The reason
    is family size. In 1971, Bangladeshi women had nearly seven children each. Today they have about
    two. In Pakistan, the figure is still three and a half.
  short:
    title: In 1971, Bangladesh Had More People Than Pakistan
- id: women_work
  heading: Women at work
  chart:
    mode: doc
    kind: bars
    kicker: Women at work · share of women 15+ in the workforce
    headline: Who goes out to work
    max: 50
    format: {decimals: 1, suffix: '%'}
