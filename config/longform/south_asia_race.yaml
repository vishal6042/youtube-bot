  narration: So, who is winning? India leads on income per person, and on keeping young children
    alive. Bangladesh leads on how long people live, and on women at work. Pakistan, richer
    than India for most of forty years, leads on none. On these four measures, it is a dead
    heat. But India's economy is almost nine times the size of Bangladesh's, and it is the
    one growing fastest.
