    - {country: Pakistan, value: 24.0, at: pakistan}
    note: ILO modelled estimates, 2025 · World Bank
  narration: Smaller families meant more women could go out to work. Today, almost thirty-nine per cent
    of Bangladeshi women are in the workforce. In India it is thirty-two per cent, up from twenty-six
    just six years earlier, the fastest rise of the three. In Pakistan, it is twenty-four.
  short:
    title: More Women Work in Bangladesh Than in India or Pakistan
