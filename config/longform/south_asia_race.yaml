  narration: Then came the surprise. Bangladesh grew year after year, and passed Pakistan in 2016. In
    2019, it passed India too. For six years, Bangladesh produced more per person than India. Only in
    2025 did India move back in front, at two thousand seven hundred and two dollars against two
    thousand five hundred and ninety-seven. Count what money actually buys at home, though, and India
    stayed ahead the whole time.
  short:
    title: Bangladesh Overtook India in 2019. Then This Happened.
