  heading: Why 2019?
  chart:
    mode: doc
    kind: kinetic
    kicker: Why 2019? · Real GDP growth
    intro: Why 2019?
    headline:
    - {text: Bangladesh ran twice as fast., at: running}
    - {text: Then the pandemic hit India harder., at: pandemic}
    format: {decimals: 1, suffix: '%', sign: true}
