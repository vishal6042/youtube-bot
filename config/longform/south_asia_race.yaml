  narration: In 2019, India was overtaken. Not by a superpower, but by a neighbour almost
    nobody was watching. Bangladesh, a country once among the poorest in the world. That year,
    the average Indian produced two thousand and forty-one dollars. The average Bangladeshi,
    two thousand one hundred and thirty. Then, six years later, India took the lead back.
    So how did India lose the lead, and how did it win it back? The answer starts sixty-five
    years ago.
  check: Bangladesh 'once among the poorest in the world' (1970s) is history, not in the data.
