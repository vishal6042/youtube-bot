  narration: India's biggest win is its children. In 1990, out of every thousand children
    born in India, a hundred and twenty-seven died before their fifth birthday. From 1998,
    Bangladesh did better. But India's numbers kept falling, and in 2022 it took the lead
    back. Today the figure is twenty-seven in India, just over thirty in Bangladesh, and fifty-six
    in Pakistan.
  short:
    title: India Just Took Back the Lead on Child Survival
