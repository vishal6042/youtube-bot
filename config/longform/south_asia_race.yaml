  narration: Bangladesh's biggest win is health. In 1980, a baby born in Bangladesh could expect to live
    fifty-two years, the shortest life of the three. It passed Pakistan in 2000 and India in 2003, and
    today it leads at almost seventy-five years. India is at seventy-two, and Pakistan at sixty-eight.
  short:
    title: Bangladeshis Now Outlive Indians and Pakistanis
