  narration: In 2019, something happened that almost nobody predicted. Bangladesh, once the poorest
    of the three, overtook India. The average Bangladeshi produced two thousand one hundred and thirty
    dollars that year. The average Indian, two thousand and forty-one. How did a country that began life
    in ruins get here? And who is really winning the South Asia race today?
  check: '"Began life in ruins": Bangladesh''s 1971 war of independence devastated the country (history, not in the data).'
  short:
    skip: true
- id: starting_line
  heading: 1960 · The starting line
  chart:
    mode: doc
    kind: terrain
    view: level
    kicker: The starting line
    big: '1960'
    big_at: '1960'
    headline: "Three countries, one\nstarting line."
    headline_at: neighbours
    note: Income per person, current US$. *Then East Pakistan. World Bank.
    cards:
    - {country: India, label: India, value: $85, at: indias}
    - {country: Pakistan, label: Pakistan, value: $82, at: pakistans}
    - {country: Bangladesh, label: Bangladesh*, value: $82, at: bangladesh}
  narration: Rewind to 1960, and the three were dead level. India's income per person was eighty-five
    dollars. Pakistan's was eighty-two. And Bangladesh, then East Pakistan, was level with both, also at
    eighty-two. Three neighbours, one starting line. What happened next is one of the great economic
    races of our time.
  short:
    skip: true
- id: pakistan_lead
  heading: 1960–2009 · Pakistan's long lead
  chart:
    mode: doc
    kind: race
    code: NY.GDP.PCAP.CD
