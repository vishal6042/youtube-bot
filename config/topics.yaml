  # ===================== AI / TECH PILLAR =====================
  # Source: Epoch AI (CC-BY). Generic `csv_url` fetcher with aggregation.
  #   agg: cummax (running max -> frontier curve) | cumcount (cumulative count)
  #        | count | sum | max | none
  # NOTE: year_max caps an incomplete current year so counts don't look like
  #       they are falling off a cliff at the end.

  - key: ai_compute
    title: "AI Training Compute"
    subtitle: "Largest model ever trained (FLOP)"
    fetcher: csv_url
    url: "https://epoch.ai/data/notable_ai_models.csv"
    date_col: "Publication date"
    value_col: "Training compute (FLOP)"
    entity_label: "Frontier model"
    agg: cummax
    year_min: 2012
    year_max: 2025
    years_window: 20
    mode: line_grow
    log_scale: true
    value_fmt: scientific
    source: "Epoch AI (CC BY)"
    mood: hopeful
    hashtags: ["ai", "technology", "dataviz"]

