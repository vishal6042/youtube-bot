    source: "World Bank"
    unit: "arrivals"
    value_scale: 1000000
    unit_suffix: "M"
    hashtags: ["travel", "tourism", "dataviz"]

  - key: mobile
    title: "Mobile Phone Subscriptions"
    subtitle: "Total mobile cellular subscriptions"
    fetcher: worldbank
    code: IT.CEL.SETS
    mode: bar_race
    source: "World Bank"
    unit: "subscriptions"
    value_scale: 1000000
