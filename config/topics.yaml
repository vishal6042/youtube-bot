# ---------------------------------------------------------------------------
# Topic catalog. Each entry is ONE video idea.
# Adding a topic = adding a block here (no code changes).
#
# Common fields:
#   key            unique id (used in output paths / --topic)
#   title          headline shown on the video
#   subtitle       optional smaller line under the title
#   fetcher        one of: worldbank | owid | dbnomics | curated_csv
#   mode           bar_race (top-N racing bars) | line_grow (single growing line)
#   source         attribution string shown on the video + caption
#   unit           optional label (e.g. "people", "USD")
#   value_scale    optional divisor for display (e.g. 1_000_000 -> "millions")
#   top_n          optional override of settings.video.top_n
#   hashtags       optional list appended to the caption
#
# Fetcher-specific fields:
#   worldbank:   code           (indicator code, e.g. SP.POP.TOTL)
#   owid:        slug           (grapher slug); value_column (optional, else auto)
#   dbnomics:    series_url     (full https://api.db.nomics.world/v22/series/... URL)
#   curated_csv: file           (filename under data/curated/, cols: entity,year,value)
# ---------------------------------------------------------------------------

topics:
  - key: population
    title: "Most Populous Countries"
    subtitle: "Population over time"
    fetcher: worldbank
    code: SP.POP.TOTL
    mode: bar_race
    source: "World Bank"
    unit: "people"
    value_scale: 1000000
    unit_suffix: "M"
    hashtags: ["population", "worldstats", "dataviz"]

  - key: gdp
    title: "Largest Economies"
    subtitle: "GDP (current US$)"
    fetcher: worldbank
    code: NY.GDP.MKTP.CD
    mode: bar_race
    source: "World Bank"
    unit: "USD"
    value_scale: 1000000000000
    unit_suffix: "T"
    hashtags: ["gdp", "economy", "dataviz"]

  - key: tourists
    title: "Most Visited Countries"
    subtitle: "International tourist arrivals"
    fetcher: worldbank
    code: ST.INT.ARVL
