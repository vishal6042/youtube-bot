  # ===================== SPORTS PILLAR =====================
  # Keys prefixed `cricket_` or `football_` land in the `sports` series —
  # one "Sports in Data" playlist for both, split later if the pillar grows.
  # Cricsheet is ODC-BY: attribution is REQUIRED, hence the `source` string —
  # it is carried into every description by caption.build_description.
  #
  # Coverage note: Cricsheet's archive runs 2002-present — ODIs have been played
  # since 1971, so this is NOT an all-time table and the copy must not imply it.
  # No `year_min`: `cumcount` totals are computed before `_clip_years`, so
  # trimming the start year would keep 2002's matches in the running totals while
  # the title claimed otherwise. Letting it start at 2002 keeps title, subtitle
  # and numbers all telling the same story.
  - key: cricket_odi_wins
    title: "Who Wins the Most ODIs?"
    subtitle: "Cumulative wins since 2002"
    fetcher: cricsheet
    url: "https://cricsheet.org/downloads/odis_male_csv2.zip"
    agg: cumcount
    mode: bar_race
    top_n: 12
    source: "Cricsheet (ODC-BY)"
    mood: majestic
    hashtags: ["cricket", "odi", "sports"]

  # T20 internationals began in 2005 and Cricsheet covers the format from the
  # start, so unlike the ODI table this one IS all-time and the copy can say so.
  - key: cricket_t20_wins
    title: "Who Wins the Most T20s?"
    subtitle: "All-time T20 international wins"
    fetcher: cricsheet
    url: "https://cricsheet.org/downloads/t20s_male_csv2.zip"
    agg: cumcount
    mode: bar_race
    top_n: 12
    value_fmt: integer
    source: "Cricsheet (ODC-BY)"
    mood: hopeful
    hashtags: ["cricket", "t20", "sports"]

  # IPL started in 2008; Cricsheet has every season. Franchise teams, not
  # countries, so no flags. Renamed franchises are merged under their current
  # name (Deccan Chargers stays separate from Sunrisers — different franchise).
  - key: cricket_ipl_wins
